services:
  db:
    image: postgres:17-alpine
    command: ["postgres", "-p", "5435"]
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: bookstore
      PGPORT: "5435"
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5435"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5435", "-U", "bookstore", "-d", "bookstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./server
    command: ["npm", "run", "db:setup"]
    environment:
      DATABASE_URL: postgresql://bookstore@db:5435/bookstore
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://bookstore@db:5435/bookstore
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      PORT: 3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run npm run auth:setup in server to generate BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://127.0.0.1:5173}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:

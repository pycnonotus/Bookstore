services:
  db:
    image: postgres:17-alpine
    command: ["postgres", "-p", "5435"]
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: bookstore
      PGPORT: "5435"
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5435"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5435", "-U", "bookstore", "-d", "bookstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: server
    command: ["npm", "run", "db:setup"]
    environment:
      DATABASE_URL: postgresql://bookstore@db:5435/bookstore
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      target: server
    environment:
      DATABASE_URL: postgresql://bookstore@db:5435/bookstore
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      PORT: 3012
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run npm run auth:setup in server to generate BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BOOKSTORE_URL:-https://books.pycnonotus.dev}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      TRUSTED_PROXY_IPS: 172.30.247.2
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-3012}:3012"
    networks:
      default:
      proxy:
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    build:
      context: .
      target: caddy
    expose:
      - "8080"
    networks:
      proxy:
        ipv4_address: 172.30.247.2
    depends_on:
      - server
    restart: unless-stopped

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.247.0/29
          # Keep dynamic assignments away from Caddy's fixed address.
          ip_range: 172.30.247.4/30

volumes:
  postgres_data:

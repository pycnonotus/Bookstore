services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: bookstore
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./server
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://bookstore@db:5432/bookstore
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://bookstore@db:5432/bookstore
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      PORT: 3000
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
